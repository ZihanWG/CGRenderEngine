name: build-and-test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out/build -DCGENGINE_BUILD_TESTS=ON -DCGENGINE_BUILD_EDITOR=ON
      - name: Build
        run: cmake --build out/build --config Release --parallel
      - name: Test
        run: ctest --test-dir out/build -C Release --output-on-failure

